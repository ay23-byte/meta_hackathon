name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Offline tests (no API key required)
        run: >-
          python -m pytest -m "not live" -q
          --cov=analysis_core --cov=ask_muse --cov=app --cov=analyze_experiment
          --cov=data_io --cov=column_inference --cov=cleaning
          --cov=statistics_core --cov=fitting_core --cov=visualization_core
          --cov=domain_modules --cov=result_schema --cov=analyze_dataset
          --cov-report=term-missing

      - name: Verify byte-compilation
        run: python -m compileall -q -x "\.venv|\.git" .
