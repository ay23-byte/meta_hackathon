name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Offline tests (no API key required)
        run: >-
          python -m pytest -m "not live" -q
          --cov=analysis_core --cov=ask_muse --cov=app --cov=analyze_experiment
          --cov-report=term-missing

      - name: Verify byte-compilation
        run: python -m compileall -q app.py analysis_core.py ask_muse.py analyze_experiment.py
