# LabLens AI lint configuration. Run: ruff check .
# Pin the ruleset so local and CI results are identical.
target-version = "py310"
line-length = 100
extend-exclude = [".venv", "results", "__pycache__", ".pytest_cache"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]

[lint.per-file-ignores]
"tests/*" = ["B011"]
